<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TEFT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="ledger"> 

        <header class="ledger-header"> 
            <h1>TEFT</h1>
            <p>Personal Betting Ledger</p>
        </header>

        <section class="ledger-page"> 


            <h2>My Ledger</h2>

           <div class="empty-state">
            <p id="emptyMessage">No entries yet.</p>

            <form id="betForm">
             <h3>New Entry</h3>
            
            <label>
                Date
                <input type="date" id="date">
            </label>

            <label>
                Event
                <input type="text" id="event" placeholder="Arsenal vs Chelsea">
            </label>

            <label>
                Sport
                <input type="text" id="sport" placeholder="Football">
            </label>

            <label>
                Market
                <input type="text" id="market" placeholder="Over 2.5">
            </label>
            
            <label>
                Odds
                <input type="number" id="odds" placeholder="1.85" step="0.01">
            </label>

            <label>
                Stake
                <input type="number" id="stake" placeholder="10" step="0.01">
            </label>

            <button type="submit">
                Write Entry
            </button>
        </form>

        <div id="betList"></div>
</div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
