<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TEFT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="ledger"> 

        <header class="ledger-header"> 
            <h1>TEFT</h1>
            <p>Personal Betting Ledger</p>
        </header>

        <section class="ledger-page"> 


<h2>My Ledger</h2>



<form id="betForm">
    <h3>New Entry</h3>
            
<div class="form-grid">

    <div class="form-field">
        <label for="betType">Bet Type</label>
        <select id="betType" required>
            <option value="single">Single</option>
            <option value="accumulator">Accumulator (Paroli)</option>
        </select>
    </div>

    <div class="form-field">
        <label for="date">Date</label>
        <input type="date" id="date" required>
    </div>

    <div class="form-field">
        <label for="sport">Sport</label>
        <input type="text" id="sport" placeholder="Football" required>
    </div>

    <div class="form-field">
        <label for="event">Event / Match</label>
        <input
            type="text"
            id="event"
            placeholder="Arsenal vs Chelsea"
            required
        >
    </div>

    <div class="form-field">
        <label for="market">Market</label>
        <input
            type="text"
            id="market"
            placeholder="Over 2.5, Home Win, BTTS..."
            required
        >
    </div>

    <div class="form-field">
        <label for="bookmaker">Bookmaker</label>
        <input
            type="text"
            id="bookmaker"
            placeholder="Stoiximan, Novibet..."
        >
    </div>

    <div class="form-field">
        <label for="odds">Odds</label>
        <input
            type="number"
            id="odds"
            min="1.01"
            step="0.01"
            placeholder="2.00"
            required
        >
    </div>

    <div class="form-field">
        <label for="stake">Stake (€)</label>
        <input
            type="number"
            id="stake"
            min="0.01"
            step="0.01"
            placeholder="10.00"
            required
        >
    </div>

</div>

<button type="submit">+ Write Entry</button>

           
</form>
<div class="empty-state">
<p id="emptyMessage">No entries yet.</p>
</div>
<div id="betList"></div>
</div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
