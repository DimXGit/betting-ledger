<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TEFT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="ledger">

        <header class="ledger-header">
            <h1>TEFT</h1>
            <p>Personal Betting Ledger</p>
        </header>

        <!-- Bookmark tabs -->
        <nav class="tabs" id="tabBar" role="tablist">
            <button type="button" class="tab-btn active" data-tab="ledger" role="tab" aria-selected="true">Ledger</button>
            <button type="button" class="tab-btn" data-tab="stats" role="tab" aria-selected="false">Stats</button>
        </nav>

        <section class="ledger-page">

            <!-- ========== LEDGER TAB ========== -->
            <section class="tab-panel" id="panelLedger" data-tab="ledger">

                <h2>My Ledger</h2>

                <details class="bankroll" id="bankroll">
                    <summary>
                        <span class="bankroll-title">Bankroll</span>
                        <span class="bankroll-total" id="bankrollTotal">€0.00</span>
                    </summary>

                    <div class="bankroll-body">
                        <p class="bankroll-empty" id="bankrollEmpty">No bookmakers yet.</p>
                        <div id="bankrollList"></div>

                        <form id="bankrollForm" class="bankroll-form">
                            <input type="text" id="bankrollName" placeholder="Stoiximan" aria-label="Bookmaker" required>
                            <input type="number" id="bankrollAmount" min="0" step="0.01" placeholder="Current balance" aria-label="Current balance (€)" required>
                            <button type="submit">Set Balance</button>
                        </form>
                    </div>
                </details>

                <!-- New Entry bar: the (+) button shows and hides the form below -->
                <div class="entry-bar">
                    <span class="entry-bar-title" id="entryBarLabel">New Entry</span>
                    <button type="button" class="entry-toggle" id="toggleFormBtn" aria-expanded="false" aria-controls="betForm" aria-label="Show entry form">+</button>
                </div>

                <form id="betForm" hidden>

                    <div class="form-grid">

                        <div class="form-field">
                            <label for="betType">Bet Type</label>
                            <select id="betType" required>
                                <option value="single">Single</option>
                                <option value="accumulator">Accumulator (Paroli)</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>

                        <div class="form-field">
                            <label for="sport">Sport</label>
                            <input type="text" id="sport" placeholder="Football" required>
                        </div>

                        <div class="form-field">
                            <label for="bookmaker">Bookmaker</label>
                            <input
                                type="text"
                                id="bookmaker"
                                list="bookmakerOptions"
                                placeholder="Stoiximan, Novibet..."
                            >
                            <datalist id="bookmakerOptions"></datalist>
                        </div>

                        <div class="form-field" id="eventField">
                            <label for="event">Event / Match</label>
                            <input
                                type="text"
                                id="event"
                                placeholder="Arsenal vs Chelsea"
                                required
                            >
                        </div>

                        <div class="form-field" id="marketField">
                            <label for="market">Market</label>
                            <input
                                type="text"
                                id="market"
                                placeholder="Over 2.5, Home Win, BTTS..."
                                required
                            >
                        </div>

                        <!-- Accumulator legs: hidden and disabled unless Bet Type is Accumulator -->
                        <fieldset class="legs" id="legsSection" hidden disabled>
                            <div class="legs-title">Legs (selections)</div>
                            <div id="legsList"></div>
                            <button type="button" id="addLegBtn" class="add-leg-btn">+ Add Leg</button>
                        </fieldset>

                        <div class="form-field">
                            <label for="odds">Odds</label>
                            <input
                                type="number"
                                id="odds"
                                min="1.01"
                                step="0.01"
                                placeholder="2.00"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="stake">Stake (€)</label>
                            <input
                                type="number"
                                id="stake"
                                min="0.01"
                                step="0.01"
                                placeholder="10.00"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="result">Result</label>
                            <select id="result" required>
                                <option value="pending">Pending</option>
                                <option value="won">Won</option>
                                <option value="lost">Lost</option>
                                <option value="void">Void</option>
                            </select>
                        </div>

                    </div>

                    <button type="submit" id="submitBtn">+ Write Entry</button>
                    <button type="button" id="cancelEditBtn" class="cancel-btn" hidden>Cancel Edit</button>

                </form>

                <h3 class="section-title">Recent Entries</h3>

                <div class="empty-state">
                    <p id="recentEmpty">No entries yet.</p>
                </div>
                <div id="recentList"></div>
                <div class="pager" id="recentPager" hidden></div>

            </section>

            <!-- ========== STATS TAB ========== -->
            <section class="tab-panel" id="panelStats" data-tab="stats" hidden>

                <h2>Stats &amp; History</h2>

                <section class="stats" id="stats">
                    <div class="stat">
                        <span class="stat-label">Profit</span>
                        <span class="stat-value" id="statProfit">€0.00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">ROI</span>
                        <span class="stat-value" id="statRoi">–</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Win Rate</span>
                        <span class="stat-value" id="statWinRate">–</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Staked</span>
                        <span class="stat-value" id="statStaked">€0.00</span>
                    </div>
                </section>
                <p class="stats-record" id="statRecord"></p>

                <details class="calendar" id="calendar">
                    <summary>
                        <span class="cal-label">Calendar</span>
                        <span class="cal-summary" id="calSummary"></span>
                    </summary>

                    <div class="cal-body">
                        <div class="cal-header">
                            <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month">‹</button>
                            <span class="cal-title" id="calTitle"></span>
                            <button type="button" class="cal-nav" id="calNext" aria-label="Next month">›</button>
                        </div>

                        <div class="cal-grid" id="calGrid"></div>

                        <div class="cal-footer">
                            <button type="button" id="clearDayBtn" class="clear-btn" hidden>Show all days</button>
                        </div>
                    </div>
                </details>

                <div class="filters" id="filters" hidden>
                    <div class="filter-row">
                        <div class="form-field">
                            <label for="filterResult">Result</label>
                            <select id="filterResult">
                                <option value="all">All</option>
                                <option value="pending">Pending</option>
                                <option value="won">Won</option>
                                <option value="lost">Lost</option>
                                <option value="void">Void</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="filterSport">Sport</label>
                            <select id="filterSport">
                                <option value="all">All</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="filterBookmaker">Bookmaker</label>
                            <select id="filterBookmaker">
                                <option value="all">All</option>
                            </select>
                        </div>

                        <div class="form-field filter-date">
                            <label for="filterFrom">From</label>
                            <input type="date" id="filterFrom">
                        </div>

                        <div class="form-field filter-date">
                            <label for="filterTo">To</label>
                            <input type="date" id="filterTo">
                        </div>

                        <button type="button" id="clearFiltersBtn" class="clear-btn">Clear</button>
                    </div>

                    <div class="filter-count" id="filterCount"></div>
                </div>

                <h3 class="section-title">History</h3>

                <div class="empty-state">
                    <p id="emptyMessage">No entries yet.</p>
                </div>
                <div id="betList"></div>
                <div class="pager" id="historyPager" hidden></div>

            </section>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
